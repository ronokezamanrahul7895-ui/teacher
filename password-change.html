<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Password Change - Teacher Portal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#06A10B" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header-root"></div>
  <div id="sidebar-backdrop-root"></div>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <h1 class="page-title">Password Change</h1>
      <div class="card" style="max-width:420px;">
        <form id="pwForm">
          <div class="form-group">
            <label for="currentPw">Current Password</label>
            <input type="password" id="currentPw" required />
          </div>
          <div class="form-group">
            <label for="newPw">New Password</label>
            <input type="password" id="newPw" required minlength="6" />
          </div>
          <div class="form-group">
            <label for="confirmPw">Confirm New Password</label>
            <input type="password" id="confirmPw" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary">Update Password</button>
          <div id="pwMessage" style="margin-top:10px;font-size:13px;"></div>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="js/password-change.js"></script>
</body>
</html>
