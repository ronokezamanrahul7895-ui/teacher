<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Student Management - Teacher Portal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#06A10B" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header-root"></div>
  <div id="sidebar-backdrop-root"></div>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <h1 class="page-title">Student Management</h1>

      <div class="card">
        <div class="search-bar">
          <input type="text" id="searchBox" placeholder="নাম, রোল বা ক্লাস দিয়ে খুঁজুন..." />
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr><th>রোল</th><th>নাম</th><th>ক্লাস</th><th>প্রোগ্রাম</th><th>ফোন</th><th></th></tr>
            </thead>
            <tbody id="studentsBody">
              <tr><td colspan="6" class="placeholder-note">লোড হচ্ছে...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card" id="editCard" style="display:none;max-width:520px;">
        <strong id="editTitle">Edit Student</strong>
        <form id="editForm" style="margin-top:12px;">
          <input type="hidden" id="e-id" />
          <div class="form-group"><label>Name</label><input id="e-name" required /></div>
          <div class="form-group"><label>Roll</label><input id="e-roll" required /></div>
          <div class="form-group"><label>Class</label><input id="e-className" /></div>
          <div class="form-group"><label>Program</label><input id="e-program" /></div>
          <div class="form-group"><label>Batch</label><input id="e-batch" /></div>
          <div class="form-group"><label>Phone</label><input id="e-phone" /></div>
          <div class="form-group"><label>Guardian Phone</label><input id="e-guardianPhone" /></div>
          <div class="form-group"><label>Email</label><input id="e-email" type="email" /></div>
          <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary">সংরক্ষণ করুন</button>
            <button type="button" class="btn btn-secondary" id="cancelEditBtn">বাতিল</button>
            <button type="button" class="btn" id="deleteBtn" style="background:#fbe1df;color:#a3271f;margin-left:auto;">মুছে ফেলুন</button>
          </div>
          <div id="editMessage" style="margin-top:10px;font-size:13px;"></div>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="js/student-management.js"></script>
</body>
</html>
