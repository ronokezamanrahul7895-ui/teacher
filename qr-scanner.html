<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QR Scanner - Teacher Portal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#06A10B" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header-root"></div>
  <div id="sidebar-backdrop-root"></div>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <h1 class="page-title">QR Scanner</h1>
      <div class="card" id="sessionInfoCard"></div>

      <div class="card" id="stepIndicator" style="font-size:14px;"></div>

      <div class="card">
        <div class="scanner-box">
          <div id="qrReaderRegion"></div>
        </div>
        <div style="text-align:center;margin-top:10px;display:flex;gap:10px;justify-content:center;">
          <button class="btn btn-secondary" id="toggleScanBtn">স্ক্যানার শুরু করুন</button>
          <button class="btn" id="cancelPendingBtn" style="display:none;background:#fbe1df;color:#a3271f;">বাতিল করুন</button>
        </div>

        <form id="manualForm" style="margin-top:16px;max-width:360px;">
          <div class="form-group">
            <label for="manualCode">ক্যামেরায় স্ক্যান না হলে কোড এখানে টাইপ করুন</label>
            <input id="manualCode" placeholder="Admit card বা খাতার কোড" />
          </div>
          <button type="submit" class="btn btn-secondary">জমা দিন</button>
        </form>
      </div>

      <div class="card scan-result-card" id="resultCard" style="display:none;"></div>
    </main>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="js/qr-scanner.js"></script>
</body>
</html>
